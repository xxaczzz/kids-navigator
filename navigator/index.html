<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5BB8F5">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Навигатор</title>
<style>
  :root {
    --ink: #2B2B3A;
    --blue: #2F80ED;
    --green: #27AE60;
    --panel: #FFFFFF;
    --muted: #6B7280;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9ED47F; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
  canvas { position: fixed; inset: 0; touch-action: none; display: block; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }

  /* maneuver banner */
  #banner {
    position: fixed; top: calc(env(safe-area-inset-top) + 10px); left: 10px; right: 10px;
    background: #1F6FD1; color: #fff; border-radius: 22px; padding: 12px 16px;
    display: flex; align-items: center; gap: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.25);
  }
  #bArrow { width: 72px; height: 72px; flex: none; }
  #bArrow svg { width: 100%; height: 100%; }
  #bDist { font-size: 40px; font-weight: 800; line-height: 1; }
  #bText { font-size: 22px; font-weight: 600; margin-top: 4px; opacity: .95; }

  /* round buttons */
  .round {
    position: fixed; width: 56px; height: 56px; border-radius: 50%;
    background: var(--panel); box-shadow: 0 4px 14px rgba(0,0,0,.25);
    font-size: 26px; display: grid; place-items: center;
  }
  #btnMute { right: 12px; top: calc(env(safe-area-inset-top) + 12px); }
  #btnCenter { right: 12px; top: calc(env(safe-area-inset-top) + 78px); }
  #btnCar { left: 12px; top: calc(env(safe-area-inset-top) + 12px); width: 64px; height: 64px; }
  #btnCar img { height: 46px; }
  #garage { top: calc(env(safe-area-inset-top) + 86px); bottom: auto; }
  #garageList { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  #garageList .dest { width: auto; }
  #garageList .pic { height: 92px; }
  #garageList img { max-height: 88px; max-width: 64px; }
  .dest.sel { background: #DBEAFE; outline: 3px solid #2F80ED; }
  body.nav #btnMute { top: auto; bottom: calc(env(safe-area-inset-bottom) + 112px); }
  body.nav #btnCenter { top: auto; bottom: calc(env(safe-area-inset-bottom) + 180px); }
  #btnStop { left: 12px; bottom: calc(env(safe-area-inset-bottom) + 112px); font-size: 24px; }

  #fuel {
    position: fixed; left: 12px; top: calc(env(safe-area-inset-top) + 88px); height: 44px; padding: 0 12px;
    display: flex; align-items: center; gap: 8px; border-radius: 22px; background: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.2);
  }
  body.nav #fuel { top: auto; bottom: calc(env(safe-area-inset-bottom) + 256px); }
  #fuel .pump { font-size: 22px; }
  #fuel .tank { width: 64px; height: 14px; border-radius: 7px; background: #E5E7EB; overflow: hidden; border: 2px solid #2B2B3A; }
  #fuelBar { display: block; height: 100%; width: 100%; transition: width .3s, background .3s; }
  #fuel.low { animation: pulse 1s ease-in-out infinite; }
  #fuel.low::after { content: 'На заправку'; font-weight: 800; font-size: 15px; color: #F2545B; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .go .key { display: inline-block; transition: transform .4s; }
  .go.turning .key { transform: rotate(90deg); }
  .go:disabled { opacity: .85; }
  #speed {
    position: fixed; left: 12px; bottom: calc(env(safe-area-inset-bottom) + 180px);
    width: 64px; height: 64px; border-radius: 50%; background: #fff; border: 4px solid #E5E7EB;
    display: grid; place-items: center; text-align: center; line-height: 1; box-shadow: 0 4px 14px rgba(0,0,0,.2);
  }
  #speed b { font-size: 24px; display: block; }
  #speed span { font-size: 11px; color: var(--muted); }

  /* dashboard during a trip */
  #dash {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 8px 10px calc(env(safe-area-inset-bottom) + 8px);
    background: linear-gradient(#2E3442, #1E222C); border-radius: 26px 26px 0 0; box-shadow: 0 -4px 18px rgba(0,0,0,.35);
    display: flex; align-items: center; gap: 6px; color: #fff;
  }
  #dash canvas { position: static; inset: auto; display: block; touch-action: auto; }
  #gauge { width: 108px; height: 65px; flex: none; }
  #fgauge { width: 56px; height: 56px; flex: none; }
  #dash .mid { flex: 1; text-align: center; min-width: 0; }
  #dash #tTime { white-space: nowrap; font-size: 24px; font-weight: 800; color: #6BE38A; line-height: 1.1; }
  #dash #tInfo { font-size: 13px; color: #C7CCD6; font-weight: 600; white-space: nowrap; }
  #btnLights { width: 52px; height: 52px; border-radius: 16px; background: #3A4152; font-size: 24px; flex: none; filter: grayscale(1) brightness(.7); }
  #btnLights.on { background: #FFD23F; filter: none; box-shadow: 0 0 16px rgba(255,210,63,.7); }
  #dash { min-height: 118px; }
  #blinkers { position: absolute; left: calc(50% - 30px); top: -26px; transform: translateX(-50%); display: flex; gap: 60px; }
  .turn { width: 66px; height: 40px; border-radius: 12px; background: #1E222C; box-shadow: 0 -2px 10px rgba(0,0,0,.35), inset 0 0 0 2px #3A4152; display: grid; place-items: center; }
  .turn svg { width: 42px; height: 28px; fill: #2F4A24; }
  .turn.right svg { transform: scaleX(-1); }
  .turn:active { transform: scale(.94); }
  .turn.lit svg { fill: #C6FF4A; filter: drop-shadow(0 0 6px #B8F04A) drop-shadow(0 0 12px rgba(184,240,74,.7)); }
  #dash .rcol { display: grid; grid-template-columns: 52px 52px; grid-template-rows: 52px 52px; gap: 8px; flex: none; align-items: center; }
  #dash .rcol #btnLights { grid-column: 1; grid-row: 2; }
  #btnHazard { grid-column: 2; grid-row: 1 / span 2; width: 52px; height: 52px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FF6B6B, #D7262E 60%, #A8141B); box-shadow: 0 4px 0 #7A0E13, 0 6px 14px rgba(0,0,0,.4); display: grid; place-items: center; }
  #btnHazard svg { width: 32px; height: 32px; }
  #btnHazard:active { transform: translateY(3px); box-shadow: 0 1px 0 #7A0E13, 0 3px 8px rgba(0,0,0,.4); }
  #btnHazard.lit { box-shadow: 0 4px 0 #7A0E13, 0 0 0 4px #FFA41B, 0 0 22px 8px rgba(255,164,27,.75); }
  #dash .rcol #btnLights, #btnSpecial { width: 52px; height: 52px; }
  #btnSpecial { border-radius: 14px; background: #3A4152; font-size: 24px; }
  #btnSpecial:active { transform: scale(.92); }
  #btnSpecial.on { background: #2F6BFF; box-shadow: 0 0 14px rgba(47,107,255,.8), 0 0 0 3px #FF3B3B inset; animation: siren .5s steps(2) infinite; }
  @keyframes siren { 50% { box-shadow: 0 0 14px rgba(255,59,59,.8), 0 0 0 3px #2F6BFF inset; background: #FF3B3B; } }
  body.nav #speed, body.nav #fuel { display: none !important; }
  body.nav #btnStop { bottom: calc(env(safe-area-inset-bottom) + 148px); }
  body.nav #btnMute { bottom: calc(env(safe-area-inset-bottom) + 148px); }
  body.nav #btnCenter { bottom: calc(env(safe-area-inset-bottom) + 214px); }
  /* trip bar (old) */
  #tripbar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 14px 20px calc(env(safe-area-inset-bottom) + 14px);
    background: var(--panel); border-radius: 22px 22px 0 0; box-shadow: 0 -4px 16px rgba(0,0,0,.15);
    display: flex; align-items: baseline; justify-content: center; gap: 18px;
  }
  #tTime { font-size: 32px; font-weight: 800; color: var(--green); }
  #tInfo { font-size: 20px; color: var(--muted); font-weight: 600; }

  /* destinations bar */
  #dests {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 10px 10px calc(env(safe-area-inset-bottom) + 10px);
    background: rgba(255,255,255,.96); border-radius: 22px 22px 0 0; box-shadow: 0 -4px 16px rgba(0,0,0,.15);
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  }
  #dests::-webkit-scrollbar { display: none; }
  .dest { flex: none; width: 84px; padding: 6px 2px; border-radius: 16px; background: #F3F4F6; text-align: center; }
  .dest:active { background: #DBEAFE; }
  .dest .pic { height: 58px; display: grid; place-items: center; font-size: 40px; }
  .dest img { max-width: 72px; max-height: 58px; }
  .dest .lbl { font-size: 13px; font-weight: 700; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dest.here { opacity: .35; }

  /* preview + arrived cards */
  .card {
    position: fixed; left: 10px; right: 10px; bottom: calc(env(safe-area-inset-bottom) + 10px);
    background: var(--panel); border-radius: 26px; padding: 16px; box-shadow: 0 8px 28px rgba(0,0,0,.3);
  }
  .card .row { display: flex; align-items: center; gap: 14px; }
  .card .pic { width: 84px; height: 84px; flex: none; display: grid; place-items: center; font-size: 56px; }
  .card .pic img { max-width: 84px; max-height: 84px; }
  .card h2 { margin: 0; font-size: 26px; }
  .card .sub { color: var(--muted); font-size: 18px; font-weight: 600; margin-top: 4px; }
  .card .btns { display: flex; gap: 10px; margin-top: 14px; }
  .go { flex: 1; height: 66px; border-radius: 20px; background: var(--green); color: #fff; font-size: 28px; font-weight: 800; box-shadow: 0 4px 0 #1E8449; }
  .go:active { transform: translateY(3px); box-shadow: 0 1px 0 #1E8449; }
  .cancel { width: 66px; height: 66px; border-radius: 20px; background: #F3F4F6; font-size: 26px; }
  .gone { display: none !important; }
  /* low fuel warning light */
  #fuelWarn { position: fixed; left: 12px; top: calc(env(safe-area-inset-top) + 12px); width: 64px; height: 64px; border-radius: 50%;
    background: #2E3442; display: grid; place-items: center; box-shadow: 0 4px 14px rgba(0,0,0,.3), 0 0 0 4px #fff; animation: warn 1.4s ease-in-out infinite; }
  #fuelWarn .bolt { display: none; font-size: 34px; filter: drop-shadow(0 0 6px rgba(255,194,26,.9)); }
  #fuelWarn.ev .bolt { display: block; }
  #fuelWarn.ev svg { display: none; }
  #fuelWarn svg { width: 36px; height: 36px; fill: #FFC21A; filter: drop-shadow(0 0 6px rgba(255,194,26,.9)); }
  #fixWarn { position: fixed; left: 12px; top: calc(env(safe-area-inset-top) + 92px); width: 64px; height: 64px; border-radius: 50%; font-size: 32px;
    background: #2E3442; display: grid; place-items: center; box-shadow: 0 4px 14px rgba(0,0,0,.3), 0 0 0 4px #fff; animation: fixw 1.2s ease-in-out infinite; }
  @keyframes fixw { 50% { box-shadow: 0 4px 14px rgba(0,0,0,.3), 0 0 0 4px #F2545B, 0 0 22px 6px rgba(242,84,91,.6); } }
  @keyframes warn { 50% { box-shadow: 0 4px 14px rgba(0,0,0,.3), 0 0 0 4px #FFC21A, 0 0 22px 6px rgba(255,194,26,.6); } }
  #btnSettings { left: 12px; bottom: calc(env(safe-area-inset-bottom) + 132px); width: 48px; height: 48px; font-size: 22px; opacity: .85; }
  #btnSettings.holding { transform: scale(1.15); background: #FFD23F; transition: transform .9s, background .9s; }
  #settings { top: calc(env(safe-area-inset-top) + 10px); bottom: auto; max-height: calc(100% - 20px); overflow-y: auto; z-index: 30; }
  #settings .sec { margin: 16px 0 8px; font-size: 14px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  #settings .driver { margin-top: 0; padding-top: 0; border-top: 0; }
  .setbtn { display: block; width: 100%; min-height: 50px; margin-top: 8px; padding: 10px 14px; border-radius: 14px; background: #F3F4F6; font-size: 17px; font-weight: 700; text-align: left; }
  .setbtn:active { background: #DBEAFE; }
  #settings .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #settings .two .setbtn { font-size: 15px; }
  .diag { font-size: 15px; line-height: 1.6; color: #374151; user-select: text; -webkit-user-select: text; }
  .diag.note { min-height: 22px; color: #1F6FD1; font-weight: 700; }
  .driver { display: flex; align-items: center; gap: 14px; margin-top: 14px; padding-top: 14px; border-top: 2px solid #F3F4F6; }
  .avatar { width: 76px; height: 76px; border-radius: 50%; background: #F3F4F6 center/cover no-repeat; font-size: 30px; flex: none; border: 4px solid #FFD23F; }
  #kidName { width: 100%; font: inherit; font-size: 22px; font-weight: 700; padding: 10px 14px; border-radius: 14px; border: 2px solid #E5E7EB; user-select: text; -webkit-user-select: text; }
  #arrived #arPic.photo { width: 190px; height: 190px; border-radius: 50%; overflow: hidden; border: 6px solid #FFD23F; box-shadow: 0 0 0 6px #fff, 0 8px 24px rgba(0,0,0,.25); position: relative; }
  #arPic.photo > img.kid { width: 100%; height: 100%; max-width: none; max-height: none; object-fit: cover; }
  #arPlace { position: absolute; right: -6px; bottom: -6px; width: 70px; height: 70px; }
  #arPlace img { max-width: 70px; max-height: 70px; }
  #arWrap { position: relative; width: 190px; margin: 0 auto; }
  #arrived { top: 50%; bottom: auto; transform: translateY(-50%); text-align: center; padding: 22px; }
  #arrived .pic { margin: 0 auto; width: 150px; height: 130px; font-size: 90px; }
  #arrived .pic img { max-width: 150px; max-height: 130px; }
  #arrived h2 { font-size: 36px; margin-top: 8px; }
  #arrived .go { background: var(--blue); box-shadow: 0 4px 0 #1B5FB8; }

  @media (orientation: landscape) {
    #banner { right: auto; width: min(460px, 60vw); }
    .card { left: auto; width: min(460px, 60vw); }
    #arrived { left: 50%; transform: translate(-50%, -50%); }
  }
</style>
</head>
<body>
<canvas id="map"></canvas>

<div id="banner" class="hidden">
  <div id="bArrow"></div>
  <div><div id="bDist"></div><div id="bText"></div></div>
</div>

<button id="fuel" class="gone" aria-label="Бензин"><span class="pump">⛽</span><span class="tank"><span id="fuelBar"></span></span></button>
<div id="speed" class="hidden"><div><b id="spd">0</b><span>км/ч</span></div></div>
<button id="btnStop" class="round hidden" aria-label="Стоп">✕</button>
<button id="btnMute" class="round gone" aria-label="Звук">🔊</button>
<button id="btnCenter" class="round" aria-label="К машинке">🎯</button>
<button id="btnCar" class="round gone" aria-label="Выбрать машинку"></button>

<div id="garage" class="card hidden gone"><button id="garageClose"></button></div>

<button id="fixWarn" class="hidden" aria-label="Машинка сломалась, в автосервис">🔧</button>
<button id="fuelWarn" class="hidden" aria-label="Мало бензина, на заправку"><span class="bolt">⚡</span><svg viewBox="0 0 24 24"><path d="M5 3h8a1 1 0 0 1 1 1v8h1.5a2 2 0 0 1 2 2v3a1 1 0 0 0 2 0V9l-2.3-2.3 1.4-1.4L21.4 8A2 2 0 0 1 22 9.4V17a3 3 0 0 1-6 0v-3h-2v7H4V4a1 1 0 0 1 1-1zm1 2v5h6V5z"/></svg></button>
<button id="btnSettings" class="round" aria-label="Настройки">⚙️</button>
<div id="settings" class="card hidden">
  <div class="row" style="justify-content:space-between"><h2>Настройки</h2><button class="cancel" id="settingsClose" style="width:52px;height:52px">✕</button></div>
  <div class="sec">Водитель</div>
  <div class="driver">
    <button id="photoBtn" class="avatar" aria-label="Фото водителя">📷</button>
    <div style="flex:1"><input id="kidName" type="text" placeholder="Имя" maxlength="20" autocomplete="off"></div>
    <input id="photoFile" type="file" accept="image/*" hidden>
  </div>
  <div class="sec">Машинка</div>
  <div id="garageList"></div>
  <div class="sec">Звук</div>
  <button id="muteToggle" class="setbtn"></button>
  <button id="voiceToggle" class="setbtn"></button>
  <button id="engineToggle" class="setbtn"></button>
  <button id="testVoice" class="setbtn">🔈 Проверить голос</button>
  <div class="sec">Игра</div>
  <button id="refuel" class="setbtn">⛽ Заправить полный бак</button>
  <button id="dayMode" class="setbtn"></button>
  <button id="weatherMode" class="setbtn"></button>
  <button id="winterMode" class="setbtn"></button>
  <button id="newYearMode" class="setbtn"></button>
  <div class="sec">О приложении</div>
  <div id="diag" class="diag"></div>
  <div id="diagNote" class="diag note"></div>
  <button id="forceUpdate" class="setbtn">🔄 Обновить приложение</button>
</div>

<div id="dash" class="hidden">
  <div id="blinkers"><button id="btnTurnL" class="turn" aria-label="Левый поворотник"><svg viewBox="0 0 48 32"><path d="M3 16 L19 3 L19 10 L45 10 L45 22 L19 22 L19 29 Z"/></svg></button><button id="btnTurnR" class="turn right" aria-label="Правый поворотник"><svg viewBox="0 0 48 32"><path d="M3 16 L19 3 L19 10 L45 10 L45 22 L19 22 L19 29 Z"/></svg></button></div>
  <canvas id="gauge" width="200" height="120" aria-label="Спидометр"></canvas>
  <div class="mid"><div id="tTime"></div><div id="tInfo"></div></div>
  <canvas id="fgauge" width="120" height="120" aria-label="Бензин"></canvas>
  <div class="rcol"><button id="btnSpecial" aria-label="Особая кнопка">📯</button><button id="btnLights" aria-label="Фары">💡</button><button id="btnHazard" aria-label="Аварийка"><svg viewBox="0 0 40 40" fill="none" stroke="#fff" stroke-linejoin="round"><path d="M20 5L36 33H4Z" stroke-width="3.2"/><path d="M20 15L28 29H12Z" stroke-width="2.6"/></svg></button></div>
</div>

<div id="dests"></div>

<div id="preview" class="card hidden">
  <div class="row">
    <div class="pic" id="pvPic"></div>
    <div><h2 id="pvName"></h2><div class="sub" id="pvInfo"></div></div>
  </div>
  <div class="btns">
    <button class="cancel" id="pvCancel">✕</button>
    <button class="go" id="pvGo"><span class="key">🔑</span> Завести</button>
  </div>
</div>

<div id="arrived" class="card hidden">
  <div id="arWrap"><div class="pic" id="arPic"></div><div id="arPlace"></div></div>
  <h2 id="arTitle">Вы прибыли!</h2>
  <div class="sub" id="arName"></div>
  <div class="btns"><button class="go" id="arOk">Куда дальше?</button></div>
</div>

<script src="app.js"></script>
<script>
  // Auto update: check for a new version on every start and when the app comes back to the screen.
  // A new version is downloaded in the background and applied with a reload, but only on the main screen,
  // never in the middle of a trip. Without internet the app keeps running from its saved files.
  if ('serviceWorker' in navigator) {
    let hadController = !!navigator.serviceWorker.controller, reloadPending = false;
    const tryReload = () => {
      const m = window.__nav && window.__nav.mode;
      if (m === 'idle' || m === undefined) location.reload(); else setTimeout(tryReload, 2000);
    };
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController) { hadController = true; return; } // first install, nothing to replace
      if (reloadPending) return; reloadPending = true; tryReload();
    });
    addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(() => {}));
  }
</script>
</body>
</html>
